<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="CampusHub">
  <defs>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8F135"/>
      <stop offset="1" stop-color="#9BE000"/>
    </linearGradient>
  </defs>

  <!-- 图标：斜切方块内嵌抽象校园（屋脊 + 立柱），呼应设计系统的 clip-path 斜切角 -->
  <rect x="4" y="8" width="44" height="44" fill="#0D110E"/>
  <rect x="4" y="8" width="44" height="44" fill="none" stroke="#C8F135" stroke-width="1.5" opacity=".45"/>
  <path d="M26 18 L44 33 H38 L26 24 L14 33 H8 Z" fill="url(#acid)"/>
  <rect x="12" y="33" width="6" height="15" fill="#C8F135" opacity=".92"/>
  <rect x="22" y="33" width="8" height="15" fill="#C8F135"/>
  <rect x="34" y="33" width="6" height="15" fill="#C8F135" opacity=".92"/>
  <rect x="10" y="48" width="32" height="2.5" fill="#C8F135"/>

  <!-- 字标：Campus(米白) + Hub(荧光绿) -->
  <text x="60" y="34" font-family="'HarmonyOS Sans','MiSans','PingFang SC',system-ui,-apple-system,sans-serif"
        font-size="23" font-weight="800" letter-spacing="-0.6" fill="#EAE2D6">Campus<tspan fill="#C8F135">Hub</tspan></text>
  <circle cx="197" cy="30" r="3" fill="#C8F135"/>

  <!-- 副标 -->
  <text x="60" y="50" font-family="'HarmonyOS Sans','MiSans',system-ui,sans-serif"
        font-size="8.5" font-weight="500" letter-spacing="2.6" fill="#7C857C">ACID CAMPUS</text>
</svg>
