<rect x="434" y="348" width="158" height="28" rx="6" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1"/>
<text x="513" y="366.15" font-size="11" fill="#41506B" text-anchor="middle">checkin·points 积分</text>
