<text x="556.5" y="558" font-size="11" font-weight="400" fill="#41506B" text-anchor="middle">msgSecCheck · imgSecCheck</text>
<rect x="657" y="510" width="177" height="68" rx="12" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.2"/>
<text x="745.5" y="536" font-size="13.5" font-weight="700" fill="#1E8449" text-anchor="middle">定时触发器</text>
<text x="745.5" y="558" font-size="11" font-weight="400" fill="#41506B" text-anchor="middle">03:00 备份 · 6h 归档+日志清理</text>

<text x="460" y="624" font-size="11.5" font-weight="400" fill="#7A8699" text-anchor="middle">所有 UGC 经微信内容安全校验 · fail-closed：任何异常即拒绝发布，绝不放行未检内容</text>
