<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<rect width="920" height="580" fill="#FFFFFF"/>
