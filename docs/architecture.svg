<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 644" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<rect width="920" height="644" fill="#FFFFFF"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9AA7B8"/></marker></defs>
<text x="460" y="40" font-size="22" font-weight="700" fill="#1F2D3D" text-anchor="middle">CampusHub 系统架构</text>
<text x="460" y="62" font-size="13" font-weight="400" fill="#7A8699" text-anchor="middle">uni-app 三端 + 37 云函数 + 微信云开发（CloudBase）· v0.9.2</text>

