<text x="622" y="324" font-size="14" font-weight="700" fill="#B5790A" text-anchor="start">★ 共享内核层</text>
<text x="622" y="344" font-size="11.5" font-weight="400" fill="#8A6212" text-anchor="start">cloudfunctions/common · 9 模块</text>
<text x="622" y="362" font-size="11.5" font-weight="400" fill="#8A6212" text-anchor="start">sync:common 一行同步 37 函数</text>
<text x="622" y="380" font-size="11.5" font-weight="400" fill="#8A6212" text-anchor="start">限频原子化 rate_limits（v0.9.2）</text>
<text x="622" y="398" font-size="11.5" font-weight="400" fill="#8A6212" text-anchor="start">fail-closed 安全 · 定时函数守卫</text>
<text x="622" y="416" font-size="11.5" font-weight="400" fill="#8A6212" text-anchor="start">软删除 / 索引定义 / 统一错误</text>

