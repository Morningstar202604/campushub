name: Bug report
description: Report a bug
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Describe the bug
      description: A clear description of what happened.
      placeholder: e.g., When I select a 3-level category and submit a post, I get an error...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce it step by step.
      placeholder: |
        1. Open the homepage
        2. Tap the publish button
        3. Select "Hobbies > Photography"
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: WeChat DevTools version, base library version, CampusHub version (see CHANGELOG / package.json), cloud env, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Cloud function logs, console errors, relevant screenshots. Do NOT include secrets or openids.
    validations:
      required: false
