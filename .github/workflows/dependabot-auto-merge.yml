name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge (Auto-merge dependabot PR)
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit-verification: true

      - name: Decide merge eligibility
        id: decide
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$ECOSYSTEM" in
            github-actions)
              echo "GitHub Actions 升级 ($UPDATE_TYPE) 自动合并"
              echo "merge=true" >> "$GITHUB_OUTPUT"
              ;;
            npm)
              if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
                echo "npm $UPDATE_TYPE 自动合并"
                echo "merge=true" >> "$GITHUB_OUTPUT"
              else
                echo "npm $UPDATE_TYPE 需人工审核"
                echo "merge=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "未知生态系统 ($ECOSYSTEM)，需人工审核"
              echo "merge=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Wait for CI checks and merge
        if: steps.decide.outputs.merge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          no_check_rounds=0
          for i in $(seq 1 40); do
            states="$(gh pr checks "$PR_URL" --json name,state,context \
              --jq '[.[] | select(.name | test("auto-merge") | not)] | [.[].state]' \
              2>/dev/null || echo '[]')"
            total="$(echo "$states" | jq 'length')"
            if [ "$total" -eq 0 ]; then
              no_check_rounds=$((no_check_rounds + 1))
              if [ "$no_check_rounds" -le 4 ]; then
                echo "暂无其他检查 — 等待 ($i/40)"
                sleep 30
                continue
              fi
              echo "无必需检查 — 直接合并并删除分支"
              gh pr merge --squash --delete-branch "$PR_URL"
              exit 0
            fi
            no_check_rounds=0
            if echo "$states" | grep -qE 'FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED'; then
              echo "存在失败或被取消的检查，放弃自动合并"
              exit 0
            fi
            passing="$(echo "$states" | jq '[.[] | select(. == "SUCCESS" or . == "SKIPPED")] | length')"
            if [ "$passing" -eq "$total" ]; then
              echo "全部检查通过 — 合并并删除分支"
              gh pr merge --squash --delete-branch "$PR_URL"
              exit 0
            fi
            echo "等待检查完成... ($i/40)"
            sleep 30
          done
          echo "等待检查超时，交由人工处理"
          exit 1
