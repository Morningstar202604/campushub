name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server · build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub
          POSTGRES_DB: campushub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: 类型检查 + 生产构建
        run: npm run build
      - name: 单元测试
        env:
          DATABASE_URL: postgresql://campushub:campushub@localhost:5432/campushub?schema=public
        run: npm test

  web:
    name: Web · build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 类型检查 + 生产构建
        run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  admin:
    name: Admin · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 生产构建
        env:
          VITE_ROUTER_HISTORY: hash
          VITE_API_BASE: /api
        run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist

  site:
    name: Site · asset integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 检查官网素材齐全
        run: |
          test -f index.html
          test -f assets/shot-home.png
          test -f assets/shot-market.png
          test -f assets/shot-publish.png
          test -f assets/shot-login.png
          test -f assets/shot-profile.png
          test -f assets/promo.mp4
          echo "官网素材完整"
