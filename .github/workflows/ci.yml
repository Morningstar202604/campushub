name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax & consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON configs
        run: |
          node -e "
            const fs=require('fs');
            const files=['package.json','project.config.json','uni-app/package.json','uni-app/src/pages.json','uni-app/src/manifest.json'];
            fs.readdirSync('cloudfunctions').forEach(d=>{
              const p='cloudfunctions/'+d+'/package.json';
              if(fs.existsSync(p)) files.push(p);
              const c='cloudfunctions/'+d+'/config.json';
              if(fs.existsSync(c)) files.push(c);
            });
            files.forEach(f=>{JSON.parse(fs.readFileSync(f,'utf8'));console.log('OK',f)});
          "

      - name: Syntax-check all JS (cloud functions)
        run: |
          set -e
          find cloudfunctions -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
          echo "All JS syntax OK"

      - name: uni-app structure & anti-pattern gate
        run: python3 uni-app/scripts/verify_pages.py

      - name: Frontend ↔ backend contract check
        run: python3 uni-app/scripts/verify_contracts.py

      - name: Generate & build gates (gateway routes + kernel inlining)
        run: |
          npm run gen:gateways:check
          npm run build:functions
          npm run build:functions:check

      - name: Contract check (frontend ↔ cloudfunctions)
        run: npm run contract

      - name: Lint & format gates
        run: |
          npm run lint:js
          npm run format

      - name: Unit tests (cloud functions)
        run: npm test

      - name: Unit tests (frontend composables + demo layer)
        run: npm run test:frontend

  build:
    name: Build all platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            uni-app/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install uni-app deps
        working-directory: uni-app
        run: npm ci

      - name: Type check (vue-tsc)
        working-directory: uni-app
        run: npx vue-tsc --noEmit

      - name: Build H5
        working-directory: uni-app
        run: npm run build:h5

      - name: Build WeChat mini program
        working-directory: uni-app
        run: npm run build:mp-weixin

      - name: Upload H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: uni-app/dist/build/h5
          retention-days: 7

      - name: Upload mp-weixin artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp-weixin-build
          path: uni-app/dist/build/mp-weixin
          retention-days: 7
