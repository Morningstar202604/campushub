version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
